name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar projeto (zip ou pasta solta)
        run: |
          if [ -f SoulOfDarkness_Android_port.zip ]; then
            unzip -q SoulOfDarkness_Android_port.zip
            echo "PROJECT_DIR=port" >> $GITHUB_ENV
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            echo "Projeto nao encontrado: suba o zip ou os arquivos do projeto na raiz"
            exit 1
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulOfDarkness-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
